[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yad2-car-bot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "requests>=2.31",
    "tenacity>=8.2",
    "click>=8.1",
    "python-dotenv>=1.0",
    "playwright>=1.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
